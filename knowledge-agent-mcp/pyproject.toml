[project]
name = "knowledge-agent-mcp"
version = "0.2.0"
description = "Read-only Knowledge Agent MCP Server for structured knowledge retrieval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anyio>=4.4.0",
  "click>=8.1.7",
  "mcp>=1.28.1",
  "pydantic>=2.8.2",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
knowledge-agent-mcp = "knowledge_agent_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_agent_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
